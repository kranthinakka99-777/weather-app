<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Now</title>
  <meta name="description" content="Check current weather and a 5-day forecast for any city.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <main class="app-shell">
    <header class="hero card">
      <p class="kicker">Live weather</p>
      <h1>Weather Now</h1>
      <p class="subtitle">Search a city to get current conditions and a 5-day snapshot.</p>

      <form id="searchForm" class="search-row" autocomplete="off">
        <label for="cityInput" class="sr-only">City name</label>
        <input id="cityInput" name="city" type="text" placeholder="Enter city (e.g. Seattle)">
        <button type="submit">Search</button>
        <button type="button" id="locationBtn" class="ghost">Use my location</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>

    <section class="current card" id="currentPanel" hidden>
      <div>
        <p class="kicker" id="locationName">—</p>
        <h2 id="temp">--°F</h2>
        <p id="condition">--</p>
      </div>
      <div class="meta-grid">
        <article>
          <p>Feels like</p>
          <strong id="feelsLike">--°F</strong>
        </article>
        <article>
          <p>Wind</p>
          <strong id="wind">-- mph</strong>
        </article>
        <article>
          <p>Humidity</p>
          <strong id="humidity">--%</strong>
        </article>
      </div>
    </section>

    <section class="forecast card" id="forecastPanel" hidden>
      <div class="panel-title">
        <h3>5-day forecast</h3>
        <p>Daily high / low + weather code</p>
      </div>
      <div id="forecastGrid" class="forecast-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
